version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booknest-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - booknest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: booknest-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - booknest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  booknest-api:
    build:
      context: .
      dockerfile: BookNest.API/Dockerfile
    container_name: booknest-api
    ports:
      - "7110:7110"
    env_file:
      - ./BookNest.API/.env
    environment:
      - ASPNETCORE_URLS=http://+:7110
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_CONNECTION=${DB_CONNECTION}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - booknest-network
    restart: unless-stopped

  booknest-subscriber:
    build:
      context: .
      dockerfile: BookNest.Subscriber/Dockerfile
    container_name: booknest-subscriber
    env_file:
      - ./BookNest.Subscriber/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - API_URL=http://booknest-api:7110
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - booknest-network
    restart: unless-stopped

networks:
  booknest-network:
    driver: bridge

volumes:
  sqlserver-data:
  rabbitmq-data:
