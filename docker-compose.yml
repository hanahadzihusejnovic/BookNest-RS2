services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU23-ubuntu-22.04
    container_name: booknest-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - booknest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: booknest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - booknest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  booknest-api:
    build:
      context: ./BookNestBackend
      dockerfile: BookNest.API/Dockerfile
    container_name: booknest-api
    ports:
      - "7110:7110"
    environment:
      ASPNETCORE_URLS: "http://+:7110"
      ASPNETCORE_ENVIRONMENT: "Development"
      DB_CONNECTION: "${DB_CONNECTION}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_DEFAULT_PASS}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_EXPIRATION_MINUTES: "${JWT_EXPIRATION_MINUTES}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      AZURE_STORAGE_CONNECTION: "${AZURE_STORAGE_CONNECTION}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - booknest-network
    restart: unless-stopped

  booknest-subscriber:
    build:
      context: ./BookNestBackend
      dockerfile: BookNest.Subscriber/Dockerfile
    container_name: booknest-subscriber
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_DEFAULT_PASS}"
      API_URL: "http://booknest-api:7110"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      booknest-api:
        condition: service_started
    networks:
      - booknest-network
    restart: unless-stopped

networks:
  booknest-network:
    driver: bridge

volumes:
  sqlserver-data:
  rabbitmq-data:
